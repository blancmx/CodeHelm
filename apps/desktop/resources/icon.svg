<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="14" />

  <!-- CodeHelm Navigation Wheel Icon -->
  <g transform="translate(256, 256) scale(15)" stroke="#ffffff" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer Helm Steering Ring -->
    <circle cx="0" cy="0" r="6.8" />

    <!-- 4 Cardinal Handles -->
    <line x1="0" y1="-10.2" x2="0" y2="-6.8" />
    <line x1="0" y1="6.8" x2="0" y2="10.2" />
    <line x1="-10.2" y1="0" x2="-6.8" y2="0" />
    <line x1="6.8" y1="0" x2="10.2" y2="0" />

    <!-- 4 Diagonal Handles -->
    <line x1="-7.21" y1="-7.21" x2="-4.81" y2="-4.81" />
    <line x1="7.21" y1="-7.21" x2="4.81" y2="-4.81" />
    <line x1="-7.21" y1="7.21" x2="-4.81" y2="4.81" />
    <line x1="7.21" y1="7.21" x2="4.81" y2="4.81" />

    <!-- Center Minimalist Code Brackets "< >" -->
    <polyline points="-2 2.2 -4.2 0 -2 -2.2" stroke-width="1.85" />
    <polyline points="2 2.2 4.2 0 2 -2.2" stroke-width="1.85" />

    <!-- Center Axis Core -->
    <circle cx="0" cy="0" r="0.9" fill="#ffffff" stroke="none" />
  </g>
</svg>