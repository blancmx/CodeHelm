appId: com.codehelm.desktop
productName: CodeHelm
copyright: Copyright © 2026 CodeHelm

directories:
  output: ../../dist-release
  buildResources: resources

files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "package.json"

# Windows Shell must be able to read the relaunch icon outside app.asar.
extraResources:
  - from: resources/icon.ico
    to: icon.ico

asar: true
asarUnpack:
  - "**/*.node"

win:
  icon: resources/icon.ico
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  # Keep product metadata/icon editing enabled, without requiring a signing certificate.
  signExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CodeHelm
