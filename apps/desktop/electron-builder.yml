appId: com.codehelm.desktop
productName: CodeHelm
copyright: Copyright © 2026 CodeHelm

directories:
  output: ../../dist-release
  buildResources: resources

files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "package.json"

asar: true
asarUnpack:
  - "**/*.node"

win:
  target:
    - target: dir
      arch:
        - x64
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CodeHelm
