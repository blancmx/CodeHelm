name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      performance:
        description: Run isolated scan, search and sustained-log acceptance samples
        type: boolean
        default: false
      java_stability:
        description: Repeat Java desktop matching ten times without retries
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-quality-gates:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        with:
          version: 11.23.0
          runtime: node@24.16.0
          cache: true
          install: false
      - run: node --version
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure required runtime fixtures
        shell: pwsh
        run: |
          "CODEHELM_E2E_PYTHON=$((Get-Command python.exe).Source)" >> $env:GITHUB_ENV
          "CODEHELM_E2E_JAVA=$env:JAVA_HOME\bin\java.exe" >> $env:GITHUB_ENV
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path -LiteralPath $compiler)) { throw 'Missing CSC runtime fixture' }
          "CODEHELM_E2E_CSC=$compiler" >> $env:GITHUB_ENV
      - run: pnpm check:ci
      - run: pnpm --filter @codehelm/safe-fs test
      - name: Package isolated Windows candidate
        run: pnpm --filter @codehelm/desktop exec electron-builder --dir --config.directories.output=../../test-results/v02-006-package
      - run: node apps/desktop/scripts/verify-release-artifacts.mjs test-results/v02-006-package/win-unpacked/resources
      - name: Packaged desktop regression
        shell: pwsh
        run: |
          $env:CODEHELM_E2E_EXECUTABLE = (Resolve-Path 'test-results/v02-006-package/win-unpacked/CodeHelm.exe').Path
          pnpm test:e2e:built
      - name: Optional Java stability acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.java_stability
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_JSON_OUTPUT_NAME = 'test-results/v02-006-java-stability-results.json'
          pnpm exec playwright test --config=playwright.config.ts --grep 'matches a selected Java' --repeat-each=10 --retries=0 --output=test-results/v02-006-java-stability-artifacts --reporter=json
      - name: Optional isolated performance acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.performance
        shell: pwsh
        run: |
          $env:CODEHELM_E2E_EXECUTABLE = (Resolve-Path 'test-results/v02-006-package/win-unpacked/CodeHelm.exe').Path
          $env:CODEHELM_E2E_SCAN_LIMIT = '1'
          pnpm exec playwright test --config=playwright.scan-performance.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CODEHELM_E2E_MATRIX = '1'
          pnpm exec playwright test --config=playwright.performance.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CODEHELM_E2E_OVERVIEW = '1'
          pnpm exec playwright test --config=playwright.performance.config.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CODEHELM_E2E_PERFORMANCE = '1'
          $env:CODEHELM_E2E_SCOPE = 'sustained'
          pnpm exec playwright test --config=playwright.candidate.config.ts --grep 'measures sustained'
      - name: Record candidate evidence
        if: always()
        shell: pwsh
        run: |
          $reports = @('test-results/e2e-results.json', 'test-results/packaged-e2e-results.json')
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.java_stability }}' -eq 'true') {
            $reports += 'test-results/v02-006-java-stability-results.json'
          }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.performance }}' -eq 'true') {
            $reports += 'test-results/v02-006-scan-limit-results.json', 'test-results/v02-006-matrix-results.json', 'test-results/v02-006-overview-results.json', 'test-results/v02-006-foreground-log-results.json'
          }
          node apps/desktop/scripts/collect-candidate-evidence.mjs test-results/v02-006-package test-results/v02-006-evidence.json @reports
      - name: Upload Electron E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-diagnostics
          path: |
            test-results/*e2e-results.json
            test-results/*e2e-artifacts/
            test-results/v02-006-evidence.json
            test-results/v02-006-*-results.json
            test-results/v02-006-*-benchmarks/
            test-results/v02-006-active-log-artifacts/
            test-results/v02-006-foreground-log-artifacts/
            test-results/v02-006-java-stability-artifacts/
          if-no-files-found: ignore
          retention-days: 7
